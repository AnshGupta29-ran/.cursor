<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deepvault Survey</title>
  <style>
    html, body { margin: 0; background: #05080c; color: #cde; font-family: ui-monospace, monospace; }
    main { max-width: 900px; margin: 0 auto; padding: 12px; }
    h1 { font-size: 18px; color: #7dffb3; margin: 0 0 8px; }
    p { font-size: 12px; color: #789; margin: 0 0 10px; }
    canvas { display: block; background: #0a1018; border: 1px solid #1e3a48; image-rendering: pixelated; }
  </style>
</head>
<body>
  <main>
    <h1>Deepvault Survey</h1>
    <p>WASD / arrows move · bump to attack · 1–3 use items · Esc pause · F5 stasis · F9 resume</p>
    <canvas id="gameCanvas" width="768" height="544" tabindex="0"></canvas>
  </main>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // focus canvas for keys
    addEventListener('load', () => document.getElementById('gameCanvas')?.focus());
  </script>
</body>
</html>
