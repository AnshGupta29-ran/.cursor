[package]
name = "sluicegate"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json", "sse", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
rusqlite = { version = "0.30", features = ["bundled"] }
macroquad = "0.4"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
anyhow = "1.0"
futures = "0.3"
