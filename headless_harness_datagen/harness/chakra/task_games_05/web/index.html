<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frostborne Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1a24;
      --ice: #9ad5f0;
      --frost: #4ec3e0;
      --deep: #143447;
      --panel: #122832;
      --danger: #e4572e;
      --gold: #f0c14b;
      --ink: #e8f2f6;
      --muted: #7f9aa8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(900px 500px at 20% -10%, #1a3a4a 0%, transparent 55%), var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px 8px;
      gap: 10px;
    }
    header {
      display: flex; flex-wrap: wrap; gap: 10px 18px;
      align-items: center; justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .hud {
      display: flex; flex-wrap: wrap; gap: 10px;
      font-family: "IBM Plex Mono", monospace; font-size: 0.82rem;
    }
    .chip {
      background: var(--panel); border: 1px solid #1e3a48;
      border-radius: 999px; padding: 6px 12px;
    }
    .chip.warn { border-color: var(--danger); color: #ffb39a; }
    .chip.good { border-color: var(--frost); color: var(--ice); }
    canvas {
      width: 100%; height: 100%;
      background: #0a1520;
      border: 1px solid #1e3a48;
      border-radius: 12px;
      cursor: pointer;
      touch-action: none;
    }
    footer {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      justify-content: space-between;
    }
    button {
      font: inherit; color: var(--ink);
      background: #163845; border: 1px solid #2a5a68;
      border-radius: 10px; padding: 8px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--frost); }
    button.primary { background: #1a4d45; border-color: var(--frost); }
    button:disabled { opacity: 0.45; cursor: default; }
    #log {
      flex: 1; min-width: 200px;
      color: var(--muted); font-size: 0.8rem;
      font-family: "IBM Plex Mono", monospace;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div>
        <h1>Frostborne Clash</h1>
        <div class="sub">Frozen frontier card battler · click a card, then a board cell · End Turn when ready</div>
      </div>
      <div class="hud">
        <span class="chip good" id="youHud">You HP — · Mana —</span>
        <span class="chip" id="aiHud">AI HP — · Mana —</span>
        <span class="chip" id="timerHud">Turn —s</span>
        <span class="chip warn" id="frostHud">Frostline 0</span>
      </div>
    </header>
    <canvas id="game" width="1000" height="640"></canvas>
    <footer>
      <div id="log">Loading…</div>
      <div style="display:flex; gap:8px;">
        <button id="btnCrystal" title="Convert unused mana into a temp ATK buff">Crystallize</button>
        <button id="btnEnd" class="primary">End Turn</button>
        <button id="btnRestart">Restart</button>
      </div>
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
